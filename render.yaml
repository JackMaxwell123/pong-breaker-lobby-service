# Optional Blueprint for a server-only repository with these files at its root.
# Manual public-repository deployment uses the equivalent settings in DEPLOYMENT.md.
# Keep the workspace free and without a payment method; usage limits still apply.
services:
  - type: web
    name: pong-breaker-rendezvous
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ALLOW_GAMEPLAY_RELAY
        value: "1"
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      - key: PB_GODOT_BINARY
        value: /opt/pong-verifier/godot
      - key: PB_REPLAY_SIMULATION
        value: /app/verifier/simulation.gd
      # Set PB_DATABASE_URL and attest PB_DURABLE_STORAGE=1 only after provisioning
      # a genuinely persistent external PostgreSQL database and tested backups.
      # No database, ad or purchase credential is committed in this Blueprint.
